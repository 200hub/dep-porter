[package]
name = "demo-app"
version = "0.1.0"
edition = "2021"
description = "示例应用程序，演示 dep-porter 的批量下载功能"

[dependencies]
# Web 框架
tokio = { version = "1.35.0", features = ["full"] }
axum = "0.7.3"

# 序列化
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.108"

# 错误处理
anyhow = "1.0.86"
thiserror = "1.0.56"

# 日志
log = "0.4.20"
env_logger = "0.11.0"

# 配置
config = "0.14.0"
dotenv = "0.15.0"

[dev-dependencies]
# 测试框架 (不使用 --include-dev 则不会下载)
tokio-test = "0.4.3"
criterion = "0.5.1"

[build-dependencies]
# 构建依赖 (不使用 --include-dev 则不会下载)
cc = "1.0.83"
